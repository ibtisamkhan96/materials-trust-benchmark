[build]
  command = "npm install"
  publish = "site"
  # npm install is only for the live Netlify functions. The assay JSON and
  # figures are generated locally by scripts/build_site.py and committed.
  # Netlify does not install pymatgen.

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
